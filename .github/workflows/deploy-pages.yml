name: Deploy CV to GitHub Pages

# Se ejecuta al hacer push a la rama principal (master) o manualmente desde la pestaña Actions
on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Permisos necesarios para que el despliegue en GitHub Pages funcione
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Evita despliegues simultáneos; deja terminar el que esté en curso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Activa GitHub Pages automáticamente si aún no está habilitado
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Publica todo el contenido de la raíz del repositorio
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
